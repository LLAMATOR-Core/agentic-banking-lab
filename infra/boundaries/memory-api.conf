server {
    listen 8002;
    server_tokens off;
    client_max_body_size 128k;
    proxy_read_timeout 180s;

    location = /health { proxy_pass http://memory-service:8002; }
    location ~ ^/api/v1/(context|working|episodic|semantic|procedure)(/|$) {
        limit_except GET POST PATCH { deny all; }
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_pass http://memory-service:8002;
    }
    location / { return 404; }
}
