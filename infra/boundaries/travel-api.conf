server {
    listen 8003;
    server_tokens off;
    client_max_body_size 64k;
    proxy_read_timeout 240s;

    location = /health { proxy_pass http://travel-agent:8003; }
    location = /.well-known/agent-card.json { proxy_pass http://travel-agent:8003; }
    location = /a2a/v1/message:send {
        limit_except POST { deny all; }
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_pass http://travel-agent:8003;
    }
    location / { return 404; }
}
