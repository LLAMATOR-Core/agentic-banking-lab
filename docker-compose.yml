name: agentic-banking

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [stand]
  environment: &python-env
    AUTH_DISABLED: ${AUTH_DISABLED:-false}
    KEYCLOAK_ISSUER: http://localhost:8080/realms/agentic-banking
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/agentic-banking/protocol/openid-connect/certs
    LANGFUSE_BASE_URL: http://langfuse-web:3000
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-agentic-banking}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-agentic-banking}
    LANGFUSE_TRACING_ENVIRONMENT: local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [stand]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo}
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [stand]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: start-dev --import-realm --hostname=http://localhost:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_BANKING_AGENT_SECRET: ${KEYCLOAK_BANKING_AGENT_SECRET:-banking-agent-secret}
      KEYCLOAK_BANK_MCP_SECRET: ${KEYCLOAK_BANK_MCP_SECRET:-bank-mcp-secret}
      KEYCLOAK_BANK_MCP_VULNERABLE_SECRET: ${KEYCLOAK_BANK_MCP_VULNERABLE_SECRET:-bank-mcp-vulnerable-secret}
      KEYCLOAK_TRAVEL_AGENT_SECRET: ${KEYCLOAK_TRAVEL_AGENT_SECRET:-travel-agent-secret}
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/agentic-banking-realm.json:/opt/keycloak/data/import/agentic-banking-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [stand]

  keycloak-configurator:
    <<: *python-service
    restart: "no"
    build:
      context: .
      args: {APP_MODULE: services.keycloak_configurator.main}
    command: ["python", "-m", "services.keycloak_configurator.main"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_BANK_MCP_SECRET: ${KEYCLOAK_BANK_MCP_SECRET:-bank-mcp-secret}
      KEYCLOAK_BANK_MCP_VULNERABLE_SECRET: ${KEYCLOAK_BANK_MCP_VULNERABLE_SECRET:-bank-mcp-vulnerable-secret}
    depends_on:
      keycloak: {condition: service_started}

  abs-api:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.abs_service.app}
    environment:
      <<: *python-env
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/banking
      ALLOWED_AZP: bank-mcp,bank-mcp-vulnerable
      EXPECTED_AUDIENCE: abs-api
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

  memory-orchestrator:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.memory_service.app}
    environment:
      <<: *python-env
      PORT: 8002
      MONGODB_URL: mongodb://root:${MONGO_ROOT_PASSWORD:-mongo}@mongo:27017/?authSource=admin
      MONGODB_DATABASE: agent_memory
      ALLOWED_AZP: banking-agent
      EXPECTED_AUDIENCE: memory-orchestrator
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      mongo: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

  abs-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.abs_mcp.app}
    environment:
      <<: *python-env
      PORT: 8101
      ALLOWED_AZP: bank-ui
      EXPECTED_AUDIENCE: abs-mcp
      ABS_API_URL: http://abs-api:8001
      SERVICE_CLIENT_ID: bank-mcp
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_BANK_MCP_SECRET:-bank-mcp-secret}
    ports: ["127.0.0.1:8101:8101"]
    depends_on: [abs-api]

  abs-mcp-vulnerable:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.abs_mcp_vulnerable.app}
    environment:
      <<: *python-env
      PORT: 8104
      ALLOWED_AZP: bank-ui
      EXPECTED_AUDIENCE: bank-mcp-vulnerable
      ABS_API_URL: http://abs-api:8001
      SERVICE_CLIENT_ID: bank-mcp-vulnerable
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_BANK_MCP_VULNERABLE_SECRET:-bank-mcp-vulnerable-secret}
    ports: ["127.0.0.1:8104:8104"]
    depends_on: [abs-api]

  duckduckgo-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.duckduckgo_mcp.app}
    environment:
      <<: *python-env
      PORT: 8105
      ALLOWED_AZP: banking-agent
      EXPECTED_AUDIENCE: duckduckgo-mcp
    ports: ["127.0.0.1:8105:8105"]
    depends_on:
      keycloak-configurator: {condition: service_completed_successfully}

  booking-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.booking_mcp.app}
    environment:
      <<: *python-env
      PORT: 8102
      ALLOWED_AZP: travel-agent
      EXPECTED_AUDIENCE: booking-mcp
    ports: ["127.0.0.1:8102:8102"]
    depends_on:
      keycloak-configurator: {condition: service_completed_successfully}

  expedia-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.expedia_mcp.app}
    environment:
      <<: *python-env
      PORT: 8103
      ALLOWED_AZP: travel-agent
      EXPECTED_AUDIENCE: expedia-mcp
    ports: ["127.0.0.1:8103:8103"]
    depends_on:
      keycloak-configurator: {condition: service_completed_successfully}

  travel-data-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.travel_data_mcp.app}
    environment:
      <<: *python-env
      PORT: 8106
      ALLOWED_AZP: travel-agent
      EXPECTED_AUDIENCE: travel-data-mcp
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
      DUFFEL_BASE_URL: ${DUFFEL_BASE_URL:-https://api.duffel.com}
    ports: ["127.0.0.1:8106:8106"]
    depends_on:
      keycloak-configurator: {condition: service_completed_successfully}

  travel-agent:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.travel_agent.app}
    environment:
      <<: *python-env
      PORT: 8003
      ALLOWED_AZP: banking-agent
      EXPECTED_AUDIENCE: travel-agent
      BOOKING_MCP_URL: http://booking-mcp:8102/mcp
      EXPEDIA_MCP_URL: http://expedia-mcp:8103/mcp
      TRAVEL_DATA_MCP_URL: http://travel-data-mcp:8106/mcp
      SERVICE_CLIENT_ID: travel-agent
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_TRAVEL_AGENT_SECRET:-travel-agent-secret}
      PUBLIC_BASE_URL: http://localhost:8003
    ports: ["8003:8003"]
    depends_on: [booking-mcp, expedia-mcp, travel-data-mcp]

  banking-agent:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.banking_agent.app}
    environment:
      <<: *python-env
      PORT: 8000
      ALLOWED_AZP: bank-ui
      EXPECTED_AUDIENCE: banking-agent
      ABS_MCP_URL: http://abs-mcp:8101/mcp
      ABS_MCP_VULNERABLE_URL: http://abs-mcp-vulnerable:8104/mcp
      DUCKDUCKGO_MCP_URL: http://duckduckgo-mcp:8105/mcp
      MEMORY_URL: http://memory-orchestrator:8002
      TRAVEL_AGENT_URL: http://travel-agent:8003
      SERVICE_CLIENT_ID: banking-agent
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_BANKING_AGENT_SECRET:-banking-agent-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    ports: ["8000:8000"]
    depends_on:
      [abs-mcp, abs-mcp-vulnerable, duckduckgo-mcp, memory-orchestrator, travel-agent]

  ui:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["3000:80"]
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [banking-agent, keycloak]
    networks: [stand]

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    ports: ["3001:3000"]
    environment: &langfuse-env
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-development-nextauth-secret}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-local-development-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: local-redis-secret
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: 11111111-1111-4111-8111-111111111111
      LANGFUSE_INIT_ORG_NAME: Agentic Banking Lab
      LANGFUSE_INIT_PROJECT_ID: 22222222-2222-4222-8222-222222222222
      LANGFUSE_INIT_PROJECT_NAME: Banking Agents
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-agentic-banking}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-agentic-banking}
      LANGFUSE_INIT_USER_EMAIL: researcher@example.test
      LANGFUSE_INIT_USER_NAME: Researcher
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-langfuse}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [stand]

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://langfuse-web:3000
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [stand]

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [stand]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "local-redis-secret", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-redis-secret", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks: [stand]

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports: ["127.0.0.1:9090:9000", "127.0.0.1:9091:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks: [stand]

networks:
  stand: {}

volumes:
  postgres-data: {}
  mongo-data: {}
  clickhouse-data: {}
  clickhouse-logs: {}
  redis-data: {}
  minio-data: {}
