name: agentic-banking

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &python-env
    AUTH_DISABLED: ${AUTH_DISABLED:-false}
    KEYCLOAK_ISSUER: http://localhost:8080/realms/agentic-banking
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/agentic-banking/protocol/openid-connect/certs
    LANGFUSE_TRACING_ENVIRONMENT: local

x-banking-env: &banking-env
  <<: *python-env
  AGENT_SYSTEM_ID: banking
  LANGFUSE_PROJECT_NAME: Banking
  LANGFUSE_PROJECT_ID: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
  LANGFUSE_BASE_URL: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${BANKING_LANGFUSE_PUBLIC_KEY:-pk-lf-banking}
  LANGFUSE_SECRET_KEY: ${BANKING_LANGFUSE_SECRET_KEY:-sk-lf-local-banking}

x-travel-env: &travel-env
  <<: *python-env
  AGENT_SYSTEM_ID: travel
  LANGFUSE_PROJECT_NAME: Travel
  LANGFUSE_PROJECT_ID: 33333333-3333-4333-8333-333333333333
  LANGFUSE_BASE_URL: http://langfuse-travel:3000
  LANGFUSE_PUBLIC_KEY: ${TRAVEL_LANGFUSE_PUBLIC_KEY:-pk-lf-travel}
  LANGFUSE_SECRET_KEY: ${TRAVEL_LANGFUSE_SECRET_KEY:-sk-lf-local-travel}

x-memory-env: &memory-env
  <<: *python-env
  AGENT_SYSTEM_ID: memory
  LANGFUSE_PROJECT_NAME: Persistent Memory
  LANGFUSE_PROJECT_ID: 44444444-4444-4444-8444-444444444444
  LANGFUSE_BASE_URL: http://langfuse-memory:3000
  LANGFUSE_PUBLIC_KEY: ${MEMORY_LANGFUSE_PUBLIC_KEY:-pk-lf-memory}
  LANGFUSE_SECRET_KEY: ${MEMORY_LANGFUSE_SECRET_KEY:-sk-lf-local-memory}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [bank-storage, platform-storage]

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo}
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks: [memory-storage]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: start-dev --import-realm --hostname=http://localhost:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_BANKING_AGENT_SECRET: ${KEYCLOAK_BANKING_AGENT_SECRET:-banking-agent-secret}
      KEYCLOAK_BANK_MCP_SECRET: ${KEYCLOAK_BANK_MCP_SECRET:-bank-mcp-secret}
      KEYCLOAK_BANK_MCP_VULNERABLE_SECRET: ${KEYCLOAK_BANK_MCP_VULNERABLE_SECRET:-bank-mcp-vulnerable-secret}
      KEYCLOAK_TRAVEL_AGENT_SECRET: ${KEYCLOAK_TRAVEL_AGENT_SECRET:-travel-agent-secret}
      KEYCLOAK_MEMORY_OPERATOR_SECRET: ${KEYCLOAK_MEMORY_OPERATOR_SECRET:-memory-operator-secret}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/keycloak/agentic-banking-realm.json:/opt/keycloak/data/import/agentic-banking-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}

    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [banking, travel, memory, platform-storage]

  keycloak-configurator:
    <<: *python-service
    restart: "no"
    build:
      context: .
      args: {APP_MODULE: services.keycloak_configurator.main, SERVICE_PACKAGE: keycloak_configurator}
    command: ["python", "-m", "services.keycloak_configurator.main"]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_BANK_MCP_SECRET: ${KEYCLOAK_BANK_MCP_SECRET:-bank-mcp-secret}
      KEYCLOAK_BANK_MCP_VULNERABLE_SECRET: ${KEYCLOAK_BANK_MCP_VULNERABLE_SECRET:-bank-mcp-vulnerable-secret}
      KEYCLOAK_MEMORY_OPERATOR_SECRET: ${KEYCLOAK_MEMORY_OPERATOR_SECRET:-memory-operator-secret}
    depends_on:
      keycloak: {condition: service_started}

    networks: [banking]

  abs-api:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.abs_service.app, SERVICE_PACKAGE: abs_service}
    environment:
      <<: *banking-env
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/banking
      ALLOWED_AZP: bank-mcp,bank-mcp-vulnerable
      EXPECTED_AUDIENCE: abs-api
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      langfuse-web: {condition: service_healthy}
      postgres: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

    networks: [banking, bank-storage]

  memory-service:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.memory_service.app, SERVICE_PACKAGE: memory_service}
    environment:
      <<: *memory-env
      PORT: 8002
      MONGODB_URL: mongodb://root:${MONGO_ROOT_PASSWORD:-mongo}@mongo:27017/?authSource=admin
      MONGODB_DATABASE: agent_memory
      ALLOWED_AZP: banking-agent
      EXPECTED_AUDIENCE: memory-service
      OPENAI_API_KEY: ${MEMORY_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${MEMORY_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      langfuse-memory: {condition: service_healthy}
      mongo: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

    networks: [memory, memory-storage]

  memory-orchestrator:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.memory_service.orchestrator, SERVICE_PACKAGE: memory_service}
    environment:
      <<: *memory-env
      PORT: 8004
      MONGODB_URL: mongodb://root:${MONGO_ROOT_PASSWORD:-mongo}@mongo:27017/?authSource=admin
      MONGODB_DATABASE: agent_memory
      ALLOWED_AZP: memory-operator
      EXPECTED_AUDIENCE: memory-orchestrator
      OPENAI_API_KEY: ${MEMORY_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${MEMORY_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      OPENAI_MODEL: ${MEMORY_OPENAI_MODEL:-${OPENAI_MODEL:-gpt-5-mini}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-true}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      MEMORY_ORCHESTRATION_INTERVAL_SECONDS: ${MEMORY_ORCHESTRATION_INTERVAL_SECONDS:-1800}
    ports: ["127.0.0.1:8004:8004"]
    depends_on:
      langfuse-memory: {condition: service_healthy}
      mongo: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

    networks: [memory, memory-storage]

  abs-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.abs_mcp.app, SERVICE_PACKAGE: abs_mcp}
    environment:
      <<: *banking-env
      PORT: 8101
      ALLOWED_AZP: bank-ui
      EXPECTED_AUDIENCE: abs-mcp
      ABS_API_URL: http://abs-api:8001
      SERVICE_CLIENT_ID: bank-mcp
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_BANK_MCP_SECRET:-bank-mcp-secret}
    ports: ["127.0.0.1:8101:8101"]
    depends_on:
      langfuse-web: {condition: service_healthy}
      abs-api: {condition: service_started}

    networks: [banking]

  abs-mcp-vulnerable:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.abs_mcp_vulnerable.app, SERVICE_PACKAGE: abs_mcp_vulnerable}
    environment:
      <<: *banking-env
      PORT: 8104
      ALLOWED_AZP: bank-ui
      EXPECTED_AUDIENCE: bank-mcp-vulnerable
      ABS_API_URL: http://abs-api:8001
      SERVICE_CLIENT_ID: bank-mcp-vulnerable
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_BANK_MCP_VULNERABLE_SECRET:-bank-mcp-vulnerable-secret}
    ports: ["127.0.0.1:8104:8104"]
    depends_on:
      langfuse-web: {condition: service_healthy}
      abs-api: {condition: service_started}

    networks: [banking]

  duckduckgo-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.duckduckgo_mcp.app, SERVICE_PACKAGE: duckduckgo_mcp}
    environment:
      <<: *banking-env
      PORT: 8105
      ALLOWED_AZP: banking-agent
      EXPECTED_AUDIENCE: duckduckgo-mcp
    ports: ["127.0.0.1:8105:8105"]
    depends_on:
      langfuse-web: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

    networks: [banking]

  flights-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.flights_mcp.app, SERVICE_PACKAGE: flights_mcp}
    environment:
      <<: *travel-env
      PORT: 8106
      FLIGHTS_MCP_AUTH_TOKEN: ${FLIGHTS_MCP_AUTH_TOKEN:-local-flights-mcp}
      FLIGHTS_MCP_NOTE_FILE: /data/${FLIGHTS_MOCK_NOTE:-clean.txt}
    volumes:
      - ./infra/flights-mcp:/data:ro
    ports: ["127.0.0.1:8106:8106"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8106/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

    networks: [travel]

  travel-agent:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.travel_agent.app, SERVICE_PACKAGE: travel_agent}
    environment:
      <<: *travel-env
      PORT: 8003
      ALLOWED_AZP: banking-agent
      EXPECTED_AUDIENCE: travel-agent
      DUCKDUCKGO_MCP_URL: http://travel-duckduckgo-mcp:8105/mcp
      FLIGHTS_PROVIDER: ${FLIGHTS_PROVIDER:-tutu}
      TUTU_MCP_URL: ${TUTU_MCP_URL:-https://mcp.tutu.ru/mcp}
      MOCK_FLIGHTS_MCP_URL: ${MOCK_FLIGHTS_MCP_URL:-http://flights-mcp:8106/mcp}
      FLIGHTS_MCP_AUTH_TOKEN: ${FLIGHTS_MCP_AUTH_TOKEN:-local-flights-mcp}
      SERVICE_CLIENT_ID: travel-agent
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_TRAVEL_AGENT_SECRET:-travel-agent-secret}
      PUBLIC_BASE_URL: http://localhost:8003
      OPENAI_API_KEY: ${TRAVEL_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${TRAVEL_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      OPENAI_MODEL: ${TRAVEL_OPENAI_MODEL:-${OPENAI_MODEL:-gpt-5-mini}}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-true}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['PORT']+'/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      langfuse-travel: {condition: service_healthy}
      travel-duckduckgo-mcp: {condition: service_started}
      flights-mcp: {condition: service_healthy}

    networks: [travel]

  banking-agent:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.banking_agent.app, SERVICE_PACKAGE: banking_agent}
    environment:
      <<: *banking-env
      PORT: 8000
      ALLOWED_AZP: bank-ui
      EXPECTED_AUDIENCE: banking-agent
      ABS_MCP_URL: ${ABS_MCP_URL:-http://abs-mcp:8101/mcp}
      ABS_MCP_MODE: ${ABS_MCP_MODE:-secure}
      ABS_MCP_VULNERABLE_URL: ${ABS_MCP_VULNERABLE_URL:-http://abs-mcp-vulnerable:8104/mcp}
      DUCKDUCKGO_MCP_URL: http://duckduckgo-mcp:8105/mcp
      MEMORY_URL: ${MEMORY_URL:-http://memory-api:8002}
      TRAVEL_AGENT_URL: ${TRAVEL_AGENT_URL:-http://travel-api:8003}
      SERVICE_CLIENT_ID: banking-agent
      SERVICE_CLIENT_SECRET: ${KEYCLOAK_BANKING_AGENT_SECRET:-banking-agent-secret}
      OPENAI_API_KEY: ${BANKING_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${BANKING_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      OPENAI_MODEL: ${BANKING_OPENAI_MODEL:-${OPENAI_MODEL:-gpt-5-mini}}
      OPENAI_JSON_MODE: ${OPENAI_JSON_MODE:-true}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-45}
      MEMORY_HTTP_TIMEOUT_SECONDS: ${MEMORY_HTTP_TIMEOUT_SECONDS:-60}
      TRAVEL_HTTP_TIMEOUT_SECONDS: ${TRAVEL_HTTP_TIMEOUT_SECONDS:-180}
      BANK_TIMEZONE: ${BANK_TIMEZONE:-Europe/Moscow}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      abs-mcp: {condition: service_started}
      abs-mcp-vulnerable: {condition: service_started}
      duckduckgo-mcp: {condition: service_started}
      memory-api: {condition: service_started}
      travel-api: {condition: service_started}
      langfuse-web: {condition: service_healthy}

    networks: [banking]

  ui:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [banking-agent, keycloak]

    networks: [banking]

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment: &langfuse-env
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-development-nextauth-secret}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:-local-development-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: local-redis-secret
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-local-seaweedfs-secret}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-langfuse}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-local-seaweedfs-secret}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_INIT_ORG_ID: 11111111-1111-4111-8111-111111111111
      LANGFUSE_INIT_ORG_NAME: Agentic Banking Lab
      LANGFUSE_INIT_PROJECT_ID: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
      LANGFUSE_INIT_PROJECT_NAME: Banking
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${BANKING_LANGFUSE_PUBLIC_KEY:-pk-lf-banking}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${BANKING_LANGFUSE_SECRET_KEY:-sk-lf-local-banking}
      LANGFUSE_INIT_USER_EMAIL: researcher@example.test
      LANGFUSE_INIT_USER_NAME: Researcher
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-langfuse}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [banking, platform-storage]

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://langfuse-web:3000
      LANGFUSE_INIT_ORG_ID: ""
      LANGFUSE_INIT_PROJECT_ID: ""
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ""
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ""
      LANGFUSE_INIT_USER_EMAIL: ""
      LANGFUSE_INIT_USER_PASSWORD: ""
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}

    networks: [platform-storage]

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks: [platform-storage]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "local-redis-secret", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-redis-secret", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

    networks: [platform-storage]

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-langfuse}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-local-seaweedfs-secret}
      S3_BUCKET: langfuse
    ports: ["127.0.0.1:9090:8333"]
    volumes: ["seaweedfs-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --aws-sigv4 'aws:amz:us-east-1:s3' --user \"$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY\" http://localhost:8333/langfuse >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [platform-storage]

  travel-duckduckgo-mcp:
    <<: *python-service
    build:
      context: .
      args: {APP_MODULE: services.duckduckgo_mcp.app, SERVICE_PACKAGE: duckduckgo_mcp}
    environment:
      <<: *travel-env
      PORT: 8105
      ALLOWED_AZP: travel-agent
      EXPECTED_AUDIENCE: travel-duckduckgo-mcp
      MCP_SERVER_NAME: travel-duckduckgo-mcp
    depends_on:
      langfuse-travel: {condition: service_healthy}
      keycloak-configurator: {condition: service_completed_successfully}

    networks: [travel]

  langfuse-travel:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_PROJECT_ID: 33333333-3333-4333-8333-333333333333
      LANGFUSE_INIT_PROJECT_NAME: Travel
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${TRAVEL_LANGFUSE_PUBLIC_KEY:-pk-lf-travel}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${TRAVEL_LANGFUSE_SECRET_KEY:-sk-lf-local-travel}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      langfuse-web: {condition: service_healthy}
    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [travel, platform-storage]

  langfuse-memory:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_PROJECT_ID: 44444444-4444-4444-8444-444444444444
      LANGFUSE_INIT_PROJECT_NAME: Persistent Memory
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${MEMORY_LANGFUSE_PUBLIC_KEY:-pk-lf-memory}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${MEMORY_LANGFUSE_SECRET_KEY:-sk-lf-local-memory}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      langfuse-travel: {condition: service_healthy}
    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [memory, platform-storage]

  travel-api:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./infra/boundaries/travel-api.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8003:8003"]
    depends_on:
      travel-agent: {condition: service_healthy}
    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [banking, travel]

  memory-api:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./infra/boundaries/memory-api.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      memory-service: {condition: service_healthy}
    sysctls: {net.ipv4.ip_forward: "0"}
    networks: [banking, memory]


networks:
  banking: {}
  travel: {}
  memory: {}
  bank-storage: {internal: true}
  memory-storage: {internal: true}
  platform-storage: {internal: true}

volumes:
  postgres-data: {}
  mongo-data: {}
  clickhouse-data: {}
  clickhouse-logs: {}
  redis-data: {}
  seaweedfs-data: {}
